/* ================= AUTH ================= */
async function checkAdmin(u){
 const ref=dbFS.collection('akun').doc(u.uid);
 const d=await ref.get();
 if(d.exists){const v=d.data();if(v.role==='admin'||v.role==='owner')return v;return null}
 const admins=await dbFS.collection('akun').where('role','==','admin').limit(1).get();
 if(admins.empty){
  const v={email:u.email,nama:u.email.split('@')[0],role:'admin',status:'active',paket:'pro',toko:'',wa:'',createdAt:Date.now()};
  await ref.set(v,{merge:true});return v;
 }
 return null;
}
function loginErr(m){const e=qs('#lgErr');e.classList.remove('hide');e.querySelector('span').textContent=m}
async function doLogin(){
 const b=qs('#loginBtn'),em=qv('#lgEmail'),pw=qv('#lgPass');
 qs('#lgErr').classList.add('hide');
 if(!em||!pw)return loginErr('Isi email dan password.');
 b.disabled=true;b.innerHTML='<span class="spin"></span> Memeriksa...';
 try{await auth.signInWithEmailAndPassword(em,pw)}
 catch(e){b.disabled=false;b.innerHTML='<i data-lucide="log-in"></i> Masuk';lucide.createIcons();loginErr(mapErr(e))}
}
async function doLogout(){stopAll();await auth.signOut()}
function stopAll(){
 if(unsub1){unsub1();unsub1=null}if(unsub2){unsub2();unsub2=null}if(unsub3){unsub3();unsub3=null}
 stopChatListeners();
 BOOTED=false;ACC=[];MITRA=[];TRAFFIC={};CHATS={};chatSel=null;ME=null;MEdoc=null;
 document.body.classList.remove('chat-open');
}

async function loadSet(){
 try{
  const d=await dbFS.collection('panelSettings').doc('panel').get();
  if(d.exists()){const v=d.data();SET=Object.assign(JSON.parse(JSON.stringify(DEF_SET)),v,{plans:normalizePlans(Object.assign({},DEF_SET.plans,v.plans||{}))})}
  else SET=JSON.parse(JSON.stringify(DEF_SET));
 }catch(e){SET=JSON.parse(JSON.stringify(DEF_SET))}
}
async function saveSet(patch){
 await dbFS.collection('panelSettings').doc('panel').set(patch,{merge:true});
 if(patch.plans)SET.plans=normalizePlans(patch.plans);
 ['namaPanel','supportEmail','waPusat','trafficOn','defPaket'].forEach(k=>{if(patch[k]!==undefined)SET[k]=patch[k]});
}

auth.onAuthStateChanged(async u=>{
 if(u){
  try{
   await loadSet();
   const prof=await checkAdmin(u);
   if(!prof){await auth.signOut();return loginErr('Email ini tidak memiliki akses Pusat Panel.')}
   ME=u;MEdoc=prof;bootApp();
  }catch(e){loginErr(mapErr(e))}
 }else{stopAll();qs('#app').classList.add('hide');qs('#landing').classList.remove('hide')}
});

/* ================= BOOT ================= */
async function bootApp(){
 qs('#landing').classList.add('hide');qs('#app').classList.remove('hide');
 const lb=qs('#loginBtn');lb.disabled=false;lb.innerHTML='<i data-lucide="log-in"></i> Masuk';
 qs('#hRange').textContent=fdateL(Date.now());
 renderHeaderDd();renderSidebar();renderHnav();
 if(!BOOTED){
  BOOTED=true;
  unsub1=dbFS.collection('akun').onSnapshot(s=>{
   ACC=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
   renderSidebar();refreshRoute();
  },e=>push('warn','Gagal memuat akun',mapErr(e)));
  unsub2=dbFS.collection('webTraffic').onSnapshot(s=>{
   TRAFFIC={};s.forEach(d=>TRAFFIC[d.id]=d.data());
   if(route==='dashboard')renderDashboard();
  },()=>{});
  unsub3=dbFS.collection('shops').onSnapshot(s=>{
   MITRA=s.docs.map(d=>{
    const v=d.data()||{};
    return {id:d.id,nama:(v.shop&&v.shop.name)||(v.profile&&v.profile.name)||v.email||d.id.split('-')[0],
     email:v.email||'',paket:v.plan||'basic',status:v.status||'active',
     alamat:(v.profile&&v.profile.address)||(v.shop&&v.shop.address)||'',
     foto:(v.profile&&v.profile.photo)||'',wa:(v.profile&&v.profile.wa)||v.shopPhone||'',
     createdAt:v.createdAt||v.updatedAt||0,raw:v};
   });
   renderSidebar();refreshRoute();
  },e=>push('warn','Gagal memuat mitra',mapErr(e)));
  startChatListeners();
  trackVisit();
 }
 go('dashboard');
 push('ok','Selamat datang','Login sebagai '+(MEdoc.nama||ME.email));
}
function refreshRoute(){
 if(route==='akun')renderAcTable();
 else if(route==='dashboard')renderDashboard();
 else if(route==='mitra')renderMitra();
 else if(route==='paket')renderPaket();
 else if(route==='pengajuan')renderPengajuan();

async function trackVisit(){
 if(SET.trafficOn===false)return;
 try{
  const k=todayKey();
  const uniq=!localStorage.getItem('pp_u_'+k);localStorage.setItem('pp_u_'+k,'1');
  const up={v:firebase.firestore.FieldValue.increment(1),last:Date.now()};
  if(uniq)up.u=firebase.firestore.FieldValue.increment(1);
  await dbFS.collection('webTraffic').doc(k).set(up,{merge:true});
 }catch(e){}
}

/* ================= ★ CHAT ADMIN ↔ MITRA =================
   Struktur: chats/{mitraEmail}/threads/pusat/messages
   — admin menulis sebagai 'cust' sehingga aplikasi Kasir mitra
     otomatis menerima sebagai chat pelanggan + notifikasi. */
let CHATS={};            // email -> thread meta {lastText,lastAt,lastFrom,...}
let chatSel=null;        // email mitra yang sedang dibuka
let chatQ='';
let unsubChatList=null,chatUnsubs=[];
let chatSeen={};try{chatSeen=JSON.parse(localStorage.getItem('pp_chat_seen')||'{}')}catch(e){}
const saveChatSeen=()=>{try{localStorage.setItem('pp_chat_seen',JSON.stringify(chatSeen))}catch(e){}};
const chatUnread=em=>{const c=CHATS[em]||{};return c.lastFrom==='shop'&&(c.lastAt||0)>(chatSeen[em]||0)};
const chatUnreadCount=()=>Object.keys(CHATS).filter(chatUnread).length;

function startChatListeners(){
 stopChatListeners();
 /* Satu listener untuk SEMUA thread 'pusat' di seluruh koleksi chats */
 unsubChatList=dbFS.collectionGroup('threads').onSnapshot(snap=>{
  CHATS={};
  snap.forEach(d=>{
   if(d.id!=='pusat')return;
   const em=d.ref.parent.parent.id;
   CHATS[em]=d.data()||{};
  });
  if(route==='chat'){renderConvList();if(chatSel)bindChatRoomMeta()}
  renderSidebar();renderHnav();
 },e=>console.warn('chat list:',e));
}
function stopChatListeners(){
 if(unsubChatList){unsubChatList();unsubChatList=null}
 stopChatRoom();
}
function stopChatRoom(){chatUnsubs.forEach(u=>{try{u()}catch(e){}});chatUnsubs=[]}

function goChat(){go('chat')}
function openChat(email){
 if(!email)return push('warn','Tidak bisa chat','Mitra ini tidak memiliki email akun.');
 chatSel=email;chatSeen[email]=Date.now();saveChatSeen();
 document.body.classList.add('chat-open');
 if(route==='chat')renderChat();else go('chat');
}
function chatBack(){chatSel=null;document.body.classList.remove('chat-open');renderChat()}

function renderChat(){
 qs('#view').innerHTML=`
 <div class="phead"><div><h1>Chat</h1><p>Chat langsung dengan mitra — balasan mereka masuk real-time dari aplikasi Kasir.</p></div></div>
 <div class="chat-wrap">
  <div class="card chat-list">
   <div class="cl-head">
    <div class="srch"><i data-lucide="search"></i><input placeholder="Cari mitra..." value="${esc(chatQ)}" oninput="chatQ=this.value;renderConvList()"></div>
   </div>
   <div class="cl-scroll" id="convList">${convListHTML()}</div>
  </div>
  <div class="card chat-room" id="chatRoom">${chatSel?chatRoomHTML():`
   <div class="empty" style="height:100%;display:flex;flex-direction:column;justify-content:center"><i data-lucide="message-square" style="width:34px;height:34px"></i>
   <p>Pilih mitra di sebelah kiri<br>untuk memulai percakapan.</p></div>`}
  </div>
 </div>`;
 lucide.createIcons();
 if(chatSel)bindChatRoom();
}
function chatRows(){
 const q=chatQ.toLowerCase();
 return MITRA.filter(m=>m.email&&(!q||m.nama.toLowerCase().includes(q)||m.email.toLowerCase().includes(q)))
  .map(m=>({m,c:CHATS[m.email]||{},unread:chatUnread(m.email)}))
  .sort((a,b)=>(b.c.lastAt||0)-(a.c.lastAt||0)||a.m.nama.localeCompare(b.m.nama));
}
function convListHTML(){
 const rows=chatRows();
 if(!rows.length)return `<div class="empty"><i data-lucide="message-square"></i><p>${chatQ?'Tidak ada mitra yang cocok.':'Belum ada mitra dengan email akun.'}</p></div>`;
 return rows.map(({m,c,unread})=>`<button class="conv ${chatSel===m.email?'active':''}" onclick="openChat('${esc(m.email)}')">
  <div class="havatar" style="width:40px;height:40px;font-size:13px">${m.foto?`<img src="${esc(m.foto)}">`:esc(initials(m.nama))}</div>
  <span class="cin"><span class="r1"><b>${esc(m.nama)}</b><span class="tm">${c.lastAt?ago(c.lastAt):''}</span></span>
  <span class="r2"><span class="pv">${c.lastText?esc(c.lastText):'Mulai percakapan…'}</span>${unread?'<span class="unb">1</span>':''}</span></span></button>`).join('');
}
function renderConvList(){
 const el=qs('#convList');if(el){el.innerHTML=convListHTML();lucide.createIcons()}
 const room=qs('#chatRoom');
 if(room&&chatSel&&!qs('#chatIn'))room.innerHTML=chatRoomHTML();
}
function chatRoomHTML(){
 const m=MITRA.find(x=>x.email===chatSel)||{nama:chatSel,email:chatSel};
 return `
 <div class="cr-head">
  <button class="ibtn cr-back" onclick="chatBack()"><i data-lucide="arrow-left"></i></button>
  <div class="havatar" style="width:38px;height:38px;font-size:13px">${m.foto?`<img src="${esc(m.foto)}">`:esc(initials(m.nama))}</div>
  <div style="flex:1;min-width:0"><b style="font-size:13.5px;display:block">${esc(m.nama)}</b>
   <div class="mono" style="font-size:10.5px;color:var(--tx2)">${esc(m.email)}</div></div>
 </div>
 <div class="msgs" id="msgs"><div class="empty" style="padding:26px 10px"><i data-lucide="loader-2"></i><p>Memuat pesan...</p></div></div>
 <div class="typing" id="typingBar"><span class="tdots"><i></i><i></i><i></i></span><span>Mitra sedang mengetik…</span></div>
 <div class="chat-inp">
  <input id="chatIn" placeholder="Tulis pesan ke mitra..." enterkeyhint="send" oninput="chatTyping(this)" onkeydown="if(event.key==='Enter')sendChatMsg()">
  <button class="btn pri send-btn" onclick="sendChatMsg()"><i data-lucide="send"></i></button>
 </div>`;
}
function bindChatRoom(){stopChatRoom();bindChatRoomMeta();bindChatRoomMsgs()}
function bindChatRoomMeta(){
 if(!chatSel)return;
 const tRef=dbFS.collection('chats').doc(chatSel).collection('threads').doc('pusat');
 chatUnsubs.push(tRef.onSnapshot(s=>{
  const d=s.data()||{};
  const typing=d.shopTyping&&d.shopTypingAt&&(Date.now()-d.shopTypingAt<10000);
  const bar=qs('#typingBar');if(bar)bar.classList.toggle('on',!!typing);
 },()=>{}));
}
function bindChatRoomMsgs(){
 if(!chatSel)return;
 const tRef=dbFS.collection('chats').doc(chatSel).collection('threads').doc('pusat');
 chatUnsubs.push(tRef.collection('messages').orderBy('at').onSnapshot(snap=>{
  const box=qs('#msgs');if(!box)return;
  const msgs=snap.docs.map(d=>d.data());
  box.innerHTML=msgs.length?msgs.map(m=>`<div class="bub ${m.from==='cust'?'me':'cust'}">${esc(m.text)}<span class="bt">${ftime(m.at)}</span></div>`).join('')
   :'<div class="empty" style="padding:26px 10px"><i data-lucide="message-circle"></i><p>Belum ada pesan.<br>Sapa mitra dengan pesan pertama!</p></div>';
  requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight});
  chatSeen[chatSel]=Date.now();saveChatSeen();renderSidebar();
  lucide.createIcons();
 },e=>console.warn('chat msgs:',e)));
}
let chatTypeT=null;
function chatTyping(el){
 if(!chatSel)return;
 const tRef=dbFS.collection('chats').doc(chatSel).collection('threads').doc('pusat');
 if(el.value.trim())tRef.set({custTyping:true,custTypingAt:Date.now()},{merge:true}).catch(()=>{});
 if(chatTypeT)clearTimeout(chatTypeT);
 chatTypeT=setTimeout(()=>{tRef.set({custTyping:false},{merge:true}).catch(()=>{})},3000);
}
function sendChatMsg(){
 if(!chatSel)return;
 const inp=qs('#chatIn');if(!inp)return;
 const text=inp.value.trim();if(!text)return;
 inp.value='';
 const tRef=dbFS.collection('chats').doc(chatSel).collection('threads').doc('pusat');
 tRef.collection('messages').add({from:'cust',text,at:Date.now(),name:'BarberGo Pusat Panel'})
  .then(()=>tRef.set({lastText:text,lastFrom:'cust',lastAt:Date.now(),customerName:'BarberGo Pusat Panel',customerPhone:SET.waPusat,withPusat:true,custTyping:false},{merge:true}))
  .catch(e=>{inp.value=text;push('err','Gagal mengirim',mapErr(e))});
}

/* ================= TRAFFIC ================= */
function trafficRows(n){const a=[];for(let i=n-1;i>=0;i--){const t=Date.now()-i*D,d=new Date(t),k=dkey(t),tr=TRAFFIC[k]||{};a.push({k,label:d.getDate()+' '+MON[d.getMonth()],full:fdate(t),v:tr.v||0,u:tr.u||0})}return a}
function sumRange(from,to){let s=0,u=0;for(let i=from;i<=to;i++){const t=TRAFFIC[dkey(Date.now()-i*D)]||{};s+=t.v||0;u+=t.u||0}return{s,u}}
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=5?5:10;return m*p}
function drawChart(){
 const box=qs('#chartBox');if(!box)return;
 const rows=trafficRows(chartDays);
 const W=Math.max(box.clientWidth,300),H=260,pl=38,pr=12,pt=16,pb=28;
 const max=niceMax(Math.max(1,...rows.map(r=>r.v)));
 const iw=W-pl-pr,ih=H-pt-pb;
 const X=i=>pl+(rows.length>1?i*(iw/(rows.length-1)):iw/2);
 const Y=v=>pt+ih-(v/max)*ih;
 const P=rows.map((r,i)=>({x:X(i),y:Y(r.v)}));
 const line=P.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
 const area=line+` L${P[P.length-1].x.toFixed(1)},${pt+ih} L${P[0].x.toFixed(1)},${pt+ih} Z`;
 const lineU=rows.map((r,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(r.u).toFixed(1)).join(' ');
 let grid='',xl='';
 for(let g=0;g<=4;g++){const gy=pt+ih-(g/4)*ih;grid+=`<line x1="${pl}" y1="${gy}" x2="${pl+iw}" y2="${gy}" stroke="var(--line)"/><text x="${pl-7}" y="${gy+3}" text-anchor="end" font-size="9" fill="var(--tx3)">${Math.round(max*g/4)}</text>`}
 const step=Math.ceil(rows.length/7);
 rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)xl+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--tx3)">${r.label}</text>`});
 box.innerHTML=`<svg id="trSvg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
  <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
  ${grid}${xl}
  <path d="${area}" fill="url(#ag)"/>
  <path d="${lineU}" fill="none" stroke="var(--tx3)" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line id="trGl" y1="${pt}" y2="${pt+ih}" stroke="var(--tx3)" stroke-dasharray="2 3" opacity="0"/>
  <circle id="trHp" r="4.5" fill="var(--blue)" stroke="var(--card)" stroke-width="2" opacity="0"/>
 </svg><div class="ctip" id="ctip"></div>`;
 CH={rows,P};
 const svg=qs('#trSvg'),tip=qs('#ctip'),gl=qs('#trGl'),hp=qs('#trHp');
 svg.addEventListener('mousemove',e=>{
  const r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width);
  let bi=0,bd=1e9;P.forEach((p,i)=>{const d=Math.abs(p.x-mx);if(d<bd){bd=d;bi=i}});
  const p=P[bi],row=rows[bi];
  gl.setAttribute('x1',p.x);gl.setAttribute('x2',p.x);gl.setAttribute('opacity','1');
  hp.setAttribute('cx',p.x);hp.setAttribute('cy',p.y);hp.setAttribute('opacity','1');
  tip.style.display='block';

/* ===== ★ Semua field Firestore ditampilkan dinamis ===== */
function fieldLabel(k){return String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase())}
function fmtVal(k,v){
 if(v===null||v===undefined||v==='')return '—';
 if(typeof v==='boolean')return `<span class="badge ${v?'b-paid':'b-gray'}">${v?'true':'false'}</span>`;
 if(typeof v==='number'){
  if(/(At|Date|Time|until|Until|expir|Expir)$/.test(k)&&v>1e11)return esc(fdate(v)+', '+ftime(v));
  return esc(v.toLocaleString('id-ID'));
 }
 if(Array.isArray(v)){
  const s=JSON.stringify(v);
  return `<span class="mono" style="font-size:10.5px;word-break:break-all">${esc(s.length>240?s.slice(0,240)+'…':s)}</span> <small style="color:var(--tx3)">(${v.length} item)</small>`;
 }
 if(typeof v==='object'){
  const s=JSON.stringify(v);
  return `<span class="mono" style="font-size:10.5px;word-break:break-all">${esc(s.length>240?s.slice(0,240)+'…':s)}</span>`;
 }
 return esc(String(v));
}
function allFieldsHTML(data,skipKeys){
 const entries=Object.entries(data||{}).filter(([k])=>!skipKeys.includes(k));
 if(!entries.length)return '<p style="font-size:12px;color:var(--tx3);padding:6px 0">Tidak ada field tambahan.</p>';
 return entries.map(([k,v])=>`<div class="dtl"><span class="dl">${esc(fieldLabel(k))}</span><span class="dv">${fmtVal(k,v)}</span></div>`).join('')+
  `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:11.5px;color:var(--blue);font-weight:700;user-select:none">Lihat JSON Mentah</summary><div class="jsonbox" style="margin-top:8px">${esc(JSON.stringify(data,null,2))}</div></details>`;
}

async function setAcPaket(id,pk){

  const a=ACC.find(x=>x.id===id);if(!a)return;
  await akunRef(id).update({paket:pk,paketChangedAt:Date.now()});
  const m=MITRA.find(x=>x.email===a.email);
  if(m)await shopRef(m.id).set({plan:pk},{merge:true});
  push('ok','Paket diubah',a.nama+' → '+pakName(pk));
 }catch(e){push('err','Gagal ubah paket',mapErr(e))}

 }catch(e){push('err','Gagal membuat akun',mapErr(e));b.disabled=false;b.innerHTML='<i data-lucide="user-plus" style="width:14px;height:14px"></i> Buat Akun';lucide.createIcons()}

 openDrawer(`<div class="dr-head">

   <button class="ibtn" onclick="closeDrawer()"><i data-lucide="x"></i></button></div>
  <div class="dr-body">
   <div class="dtl"><span class="dl">Paket</span><span class="dv"><span class="badge ${pakBadge(m.paket)}">${pakName(m.paket)}</span></span></div>
   <div class="dtl"><span class="dl">Status</span><span class="dv"><span class="badge ${stBadge(m.status)}">${stName(m.status)}</span></span></div>

   </select>
   <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">

     <i data-lucide="${m.status==='suspended'?'play':'pause'}" style="width:14px;height:14px"></i> ${m.status==='suspended'?'Aktifkan':'Suspen'}</button>
    ${m.wa?`<a class="btn wa" style="flex:1" href="https://wa.me/${esc(String(m.wa).replace(/\D/g,''))}" target="_blank" rel="noopener"><i data-lucide="message-circle" style="width:14px;height:14px"></i> WhatsApp</a>`:''}
   </div>
   <div class="blk-label" style="margin-top:20px">Semua Data Firestore (shops/${esc(m.id.slice(0,10))}…)</div>
   ${allFieldsHTML(m.raw,[])}
   ${reqs.length?`<div class="blk-label" style="margin-top:20px">Riwayat Pengajuan (${reqs.length})</div>
    ${reqs.sort((a,b)=>b.at-a.at).map(r=>`<div class="rrow">
     <div class="in"><b>${pakName(r.from)} → ${esc(r.toName||pakName(r.to))}</b><small>${fdate(r.at)}${r.note?' · "'+esc(r.note)+'"':''}</small></div>
     <span class="badge ${rSt(r)==='pending'?'b-warn':rSt(r)==='approved'?'b-paid':'b-can'}">${rSt(r)==='pending'?'Menunggu':rSt(r)==='approved'?'Diterima':'Ditolak'}</span>

async function setMitraPaket(id,pk){
 try{
  const m=MITRA.find(x=>x.id===id);if(!m)return;
  await shopRef(id).set({plan:pk},{merge:true});
  const a=ACC.find(x=>x.email===m.email);
  if(a)await akunRef(a.id).update({paket:pk,paketChangedAt:Date.now()});
  push('ok','Paket mitra diubah',m.nama+' → '+pakName(pk));
 }catch(e){push('err','Gagal',mapErr(e))}
}
async function setMitraStatus(id,st){
 try{
  const m=MITRA.find(x=>x.id===id);if(!m)return;
  await shopRef(id).set({status:st},{merge:true});
  const a=ACC.find(x=>x.email===m.email);
  if(a)await akunRef(a.id).update({status:st});
  push('ok',st==='suspended'?'Mitra disuspen':'Mitra diaktifkan',m.nama);
  openDrawerMitra(id);
 }catch(e){push('err','Gagal',mapErr(e))}
}

/* ================= KELOLA PAKET ================= */
function renderPaket(){
 const keys=PLAN_KEYS();
 qs('#view').innerHTML=`

  <button class="btn pri" onclick="openPaketModal('')"><i data-lucide="plus"></i> Tambah Paket</button></div>
 <div class="pkgrid">
  ${keys.map(k=>{
   const p=SET.plans[k];
   const cnt=ACC.filter(a=>(a.paket||'basic')===k).length;
   return `<div class="pkcard ${p.on?'':'off'}">
    <div class="pktop"><span class="badge ${pakBadge(k)}">${esc(k)}</span>
     <span class="badge ${p.on?'b-paid':'b-gray'}">${p.on?'Aktif':'Nonaktif'}</span></div>
    <div class="pkn">${esc(p.n)}</div>
    <div class="pkd">${esc(p.dur)}</div>
    <div class="pkp">Rp ${esc(p.harga)}</div>
    <ul class="pkfeat">${(p.feat||[]).length?p.feat.map(f=>`<li>${esc(f)}</li>`).join(''):'<li class="no">Belum ada fitur diisi</li>'}</ul>
    <div class="pkcnt"><i data-lucide="users" style="width:13px;height:13px"></i> ${cnt} akun memakai paket ini</div>
    <div style="display:flex;gap:8px;margin-top:14px">
     <button class="btn gho sm" style="flex:1" onclick="openPaketModal('${k}')"><i data-lucide="pencil" style="width:13px;height:13px"></i> Edit</button>
     <button class="btn gho sm" onclick="togglePaket('${k}')">${p.on?'Nonaktifkan':'Aktifkan'}</button>
     <button class="ibtn red" title="Hapus paket" onclick="delPaket('${k}')"><i data-lucide="trash-2"></i></button>
    </div>
   </div>`}).join('')}
 </div>
 <p style="font-size:11px;color:var(--tx3);margin-top:16px;display:flex;gap:7px;align-items:center"><i data-lucide="info" style="width:13px;height:13px"></i> Paket nonaktif tidak muncul di pilihan saat membuat akun baru, tapi akun yang memakainya tetap berjalan.</p>`;
 lucide.createIcons();
}
function openPaketModal(key){
 const isNew=!key;
 const p=isNew?{n:'',dur:'',harga:'',feat:[],on:true}:SET.plans[key];
 openModal(`<h3>${isNew?'Tambah Paket Baru':'Edit Paket — '+esc(p.n)}</h3>
  <label class="f">Nama Paket</label><input id="pkN" value="${esc(p.n)}" placeholder="Contoh: Platinum">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
   <div><label class="f">Durasi</label><input id="pkDur" value="${esc(p.dur)}" placeholder="1 Bulan"></div>
   <div><label class="f">Harga (Rp)</label><input id="pkHarga" value="${esc(p.harga)}" placeholder="149.000"></div>
  </div>
  <label class="f">Fitur (satu per baris)</label>
  <textarea id="pkFeat" rows="4" placeholder="Semua fitur Gold&#10;Free haircut tiap bulan">${esc((p.feat||[]).join('\n'))}</textarea>
  <label class="ck"><input type="checkbox" id="pkOn" ${p.on?'checked':''}> Paket aktif (tampil saat pendaftaran)</label>
  <div class="mrow"><button class="btn gho" onclick="closeModal()">Batal</button><button class="btn pri" id="pkGo" onclick="savePaket('${esc(key)}')"><i data-lucide="check" style="width:14px;height:14px"></i> Simpan Paket</button></div>`);
 setTimeout(()=>{const e=qs('#pkN');e&&e.focus()},80);
}
async function savePaket(key){
 const n=qv('#pkN'),dur=qv('#pkDur'),harga=qv('#pkHarga');
 const feat=qv('#pkFeat').split('\n').map(x=>x.trim()).filter(Boolean);
 const on=qs('#pkOn').checked;
 if(n.length<2)return push('err','Gagal','Nama paket minimal 2 karakter.');
 if(!dur)return push('err','Gagal','Isi durasi paket.');
 if(!harga)return push('err','Gagal','Isi harga paket.');
 let k=key;
 if(!k){
  k=slug(n)||('pk'+Date.now().toString(36));
  if(SET.plans[k])return push('err','Gagal','Paket dengan nama serupa sudah ada. Gunakan nama lain.');
 }
 const plans=JSON.parse(JSON.stringify(SET.plans));
 plans[k]={n,dur,harga,feat,on};
 try{
  await saveSet({plans});
  closeModal();renderPaket();renderSidebar();
  push('ok','Paket tersimpan',n+' ('+dur+')');
 }catch(e){push('err','Gagal menyimpan',mapErr(e))}
}
async function togglePaket(key){
 const plans=JSON.parse(JSON.stringify(SET.plans));
 plans[key].on=!plans[key].on;
 try{await saveSet({plans});renderPaket();push('ok',plans[key].on?'Paket diaktifkan':'Paket dinonaktifkan',plans[key].n)}
 catch(e){push('err','Gagal',mapErr(e))}
}
function delPaket(key){
 const p=SET.plans[key];if(!p)return;
 const cnt=ACC.filter(a=>(a.paket||'basic')===key).length;
 if(cnt>0)return push('warn','Tidak bisa dihapus',cnt+' akun masih memakai paket '+p.n+'. Pindahkan akun dulu atau nonaktifkan saja.');
 confirmM({t:'Hapus paket '+p.n+'?',m:'Paket akan dihapus permanen dari daftar paket.',ok:'Ya, hapus',dng:true,fn:async()=>{
  const plans=JSON.parse(JSON.stringify(SET.plans));delete plans[key];
  await saveSet({plans});renderPaket();renderSidebar();
  push('ok','Paket dihapus',p.n);
 }});
}

/* ================= PENGAJUAN PAKET ================= */
function allReqs(){
 const out=[];
 MITRA.forEach(m=>{
  (m.raw.planRequests||[]).forEach(r=>out.push({...r,uid:m.id,shopName:m.nama,shopEmail:m.email,shopWa:m.wa}));
 });
 return out.sort((a,b)=>(b.at||0)-(a.at||0));
}
function renderPengajuan(){
 const all=allReqs();
 const cnt={pending:0,approved:0,rejected:0};
 all.forEach(r=>{cnt[rSt(r)]=(cnt[rSt(r)]||0)+1});
 const l=reqTab==='all'?all:all.filter(r=>rSt(r)===reqTab);
 qs('#view').innerHTML=`
 <div class="phead"><div><h1>Pengajuan Paket</h1><p>Terima atau tolak pengajuan upgrade paket dari mitra (aplikasi Kasir).</p></div>
  <div class="tabs">
   <button class="${reqTab==='pending'?'on':''}" onclick="reqTab='pending';renderPengajuan()">Menunggu (${cnt.pending||0})</button>
   <button class="${reqTab==='approved'?'on':''}" onclick="reqTab='approved';renderPengajuan()">Diterima (${cnt.approved||0})</button>

   <button class="${reqTab==='all'?'on':''}" onclick="reqTab='all';renderPengajuan()">Semua</button>
  </div></div>
 ${l.length?l.map(r=>{
  const st=rSt(r);
  const waNum=String(r.shopWa||'').replace(/\D/g,'').replace(/^0/,'62');
  return `<div class="reqcard ${st}">
   <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="havatar" style="width:40px;height:40px;font-size:14px">${esc(initials(r.shopName))}</div>
    <div style="flex:1;min-width:160px"><b style="font-size:13.5px;display:block">${esc(r.shopName)}</b>
     <small style="color:var(--tx2)">${esc(r.shopEmail||'—')} · ${ago(r.at)}${r.decidedAt?' · diputuskan '+fdate(r.decidedAt):''}</small></div>
    <span class="badge ${st==='pending'?'b-warn':st==='approved'?'b-paid':'b-can'}">${st==='pending'?'Menunggu':st==='approved'?'Diterima':'Ditolak'}</span>
   </div>
   <div class="reqarrow">${pakName(r.from)} <i data-lucide="arrow-right"></i> ${esc(r.toName||pakName(r.to))}</div>
   ${r.note?`<p style="font-size:12px;color:var(--tx2);margin-top:8px;font-style:italic">"${esc(r.note)}"</p>`:''}
   <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
    ${st==='pending'?`
     <button class="btn pri sm" onclick="reqDecide('${r.uid}','${r.id}',true)"><i data-lucide="check" style="width:13px;height:13px"></i> Terima</button>
     <button class="btn dng sm" onclick="reqDecide('${r.uid}','${r.id}',false)"><i data-lucide="x" style="width:13px;height:13px"></i> Tolak</button>`:''}
    ${r.shopEmail?`<button class="btn gho sm" onclick="openChat('${esc(r.shopEmail)}')"><i data-lucide="message-square" style="width:13px;height:13px"></i> Chat</button>`:''}
    ${waNum?`<a class="btn wa sm" href="https://wa.me/${esc(waNNumFmt(waNum))}?text=${encodeURIComponent(reqWaMsg(r,st))}" target="_blank" rel="noopener"><i data-lucide="message-circle" style="width:13px;height:13px"></i> ${st==='pending'?'Tanya via WA':'Kabari via WA'}</a>`:''}
   </div>
  </div>`}).join('')
 :`<div class="card" style="padding:8px"><div class="empty"><i data-lucide="inbox"></i><p>Tidak ada pengajuan pada tab ini.</p></div></div>`}`;
 lucide.createIcons();
}
function waNNumFmt(n){return n.replace(/^0/,'62')}
function reqWaMsg(r,st){
 if(st==='approved')return `Halo ${r.shopName}! Pengajuan upgrade paket Anda ke ${r.toName||pakName(r.to)} telah DISETUJUI. Paket sudah aktif. Terima kasih.— BarberGo Pusat`;
 if(st==='rejected')return `Halo ${r.shopName}! Mohon maaf, pengajuan upgrade paket Anda ke ${r.toName||pakName(r.to)} belum dapat kami setujui saat ini. Hubungi kami untuk info lebih lanjut.— BarberGo Pusat`;
 return `Halo ${r.shopName}! Terkait pengajuan upgrade paket ke ${r.toName||pakName(r.to)}, mohon info konfirmasi pembayaran. Terima kasih.— BarberGo Pusat`;
}
async function reqDecide(uid,rid,ok){
 const m=MITRA.find(x=>x.id===uid);if(!m)return;
 const req=(m.raw.planRequests||[]).find(r=>r.id===rid);if(!req)return;
 confirmM({t:(ok?'Terima':'Tolak')+' pengajuan?',m:ok
  ?`Paket <b>${esc(m.nama)}</b> akan langsung diubah ke <b>${esc(req.toName||pakName(req.to))}</b> dan akun kasirnya ikut diperbarui.`
  :`Pengajuan dari <b>${esc(m.nama)}</b> akan ditandai ditolak. Paket mereka tidak berubah.`,
  ok:ok?'Ya, terima':'Ya, tolak',dng:!ok,fn:async()=>{
   const reqs=(m.raw.planRequests||[]).map(r=>r.id===rid?{...r,status:ok?'approved':'rejected',decidedAt:Date.now(),decidedBy:ME.email}:r);
   const upd={planRequests:reqs};
   if(ok)upd.plan=req.to;
   await shopRef(uid).update(upd);
   const a=ACC.find(x=>x.email===m.email);
   if(a&&ok)await akunRef(a.id).update({paket:req.to,paketChangedAt:Date.now()});
   push('ok',ok?'Pengajuan diterima':'Pengajuan ditolak',m.nama+' → '+(ok?pakName(req.to):'tetap '+pakName(m.paket)));
  }});
}

function renderProfil(){
 qs('#view').innerHTML=`
 <div class="phead"><div><h1>Profil Saya</h1><p>Kelola identitas akun admin pusat.</p></div></div>
 <div class="card pad" style="max-width:560px">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
   <div class="photopick" onclick="qs('#pfIn').click()" title="Ketuk untuk ganti foto">
    ${MEdoc.foto?`<img src="${esc(MEdoc.foto)}">`:`<i data-lucide="camera"></i>`}
   </div>
   <input id="pfIn" type="file" accept="image/*" class="hide" onchange="pickProfil(this)">
   <div style="flex:1;min-width:160px"><b style="font-size:16px">${esc(MEdoc.nama||'Admin')}</b>
    <div style="font-size:11.5px;color:var(--tx2)">${esc(ME.email)} · <span class="badge b-admin">${esc(MEdoc.role||'admin')}</span></div></div>
  </div>
  <label class="f">Nama</label><input id="pfNama" value="${esc(MEdoc.nama||'')}">
  <label class="f">Email (terkunci)</label><input value="${esc(ME.email)}" disabled>
  <label class="f">No. WhatsApp</label><input id="pfWa" value="${esc(MEdoc.wa||'')}" placeholder="08xxxxxxxxxx">
  <button class="btn pri" style="margin-top:18px" onclick="saveProfil()"><i data-lucide="check" style="width:14px;height:14px"></i> Simpan Profil</button>
 </div>`;
 lucide.createIcons();
}
async function pickProfil(input){
 const file=input.files[0];if(!file)return;
 const holder=input.parentNode;
 const local=await fileToDataURL(file);
 const old=holder.innerHTML;
 holder.innerHTML=`<img src="${local}">`;
 const spin=document.createElement('div');spin.className='upspin';spin.innerHTML='<span class="spin"></span>';
 holder.appendChild(spin);
 try{
  const url=await cloudUpload(file);
  MEdoc.foto=url;await akunRef(ME.uid).set({foto:url},{merge:true});
  renderProfil();renderHeaderDd();push('ok','Foto diperbarui','Foto profil admin tersimpan.');
 }catch(e){holder.innerHTML=old;lucide.createIcons();push('err','Upload gagal',mapErr(e))}
}
async function saveProfil(){
 const nama=qv('#pfNama'),wa=qv('#pfWa');
 if(nama.length<2)return push('err','Gagal','Nama minimal 2 karakter.');
 try{
  await akunRef(ME.uid).set({nama,wa},{merge:true});
  MEdoc.nama=nama;MEdoc.wa=wa;
  renderHeaderDd();renderSidebar();
  push('ok','Profil tersimpan','Data profil diperbarui.');
 }catch(e){push('err','Gagal',mapErr(e))}
}
</script>
